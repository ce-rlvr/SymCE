# Evaluation suite.
#
# Run with:
#   python -m training.eval.run_suite --config configs/eval/full_eval.yaml
#
# Filter to a subset:
#   python -m training.eval.run_suite --config configs/eval/full_eval.yaml \
#       --only-models qwen-rlvr --only-benchmarks counterexample,gsm8k
#
# Dry-run (lists the cartesian without launching anything):
#   python -m training.eval.run_suite --config configs/eval/full_eval.yaml --dry-run

suite_name: symce_full
seed: 42
reward_workers: 8

pass_at_k_values: [1, 3, 5, 8]

sampling:
  greedy:
    n_samples: 1
    temperature: 0.0
    max_new_tokens: 1024
    top_p: 1.0
  sampled:
    n_samples: 8
    temperature: 0.7
    max_new_tokens: 1024
    top_p: 0.95

cache:
  enabled: true
  path: runs/eval_cache/cache.sqlite

backends:
  vllm:
    dtype: bfloat16
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    trust_remote_code: true
  unsloth:
    dtype: bfloat16
    max_model_len: 4096
  openai:
    env_var: OPENAI_API_KEY
    max_concurrent_requests: 8
    request_timeout_seconds: 120.0
    max_retries: 5
  deepseek:
    env_var: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com"
    max_concurrent_requests: 8
  anthropic:
    env_var: ANTHROPIC_API_KEY
    max_concurrent_requests: 4
  gemini:
    env_var: GEMINI_API_KEY
    max_concurrent_requests: 4

models:
  # Our pipeline
  - name: qwen-base
    backend: vllm
    model_id: Qwen/Qwen2.5-Math-1.5B
    model_type: base
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: false

  - name: qwen3-base
    backend: vllm
    model_id: unsloth/Qwen3-4B
    model_type: base
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: false

  - name: qwen-sft
    backend: vllm
    # EDIT to your actual SFT merged checkpoint dir, e.g.
    #   runs/sft/20260520-101010__full_run__seed42__abc1234/merged
    model_id: runs/sft/20260520-060436__full_run__seed42__638156c/merged
    model_type: sft
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: true     # control vs RLVR for the v2-prompt comparison

  - name: qwen-rlvr
    backend: vllm
    # EDIT to your actual RLVR merged checkpoint dir
    model_id: runs/rlvr/20260521-112140__full_run_dense_test__seed42__db0287f/merged
    model_type: rlvr
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: true     # capture catastrophic-forgetting signal

  - name: qwen-rlvr-sparse
    backend: vllm
    # EDIT to your actual RLVR merged checkpoint dir
    model_id: runs/rlvr/20260520-234745__full_run_sparse__seed42__db0287f/merged
    model_type: rlvr
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: true     # capture catastrophic-forgetting signal

  # Open-source baselines
  - name: deepseek-math-7b-rl
    backend: vllm
    model_id: deepseek-ai/deepseek-math-7b-rl
    model_type: open_baseline
    enabled: false

  - name: qwen25-math-7b-instruct
    backend: vllm
    model_id: Qwen/Qwen2.5-Math-7B-Instruct
    model_type: open_baseline
    enabled: false

  - name: eurus-2-7b-prime
    backend: vllm
    model_id: PRIME-RL/Eurus-2-7B-PRIME
    model_type: open_baseline
    enabled: false

  - name: abel-7b-002
    backend: vllm
    model_id: GAIR/Abel-7B-002
    model_type: open_baseline
    enabled: false

  - name: mammoth2-7b-plus
    backend: vllm
    model_id: TIGER-Lab/MAmmoTH2-7B-Plus
    model_type: open_baseline
    enabled: false

  # Commercial APIs - disabled by default (cost!)
  # Flip enabled: true on the ones you actually want. Heavy on MATH (5000
  # problems x 8 samples) - consider also setting math.limit to keep cost down.
  - name: gpt-4o
    backend: openai
    model_id: gpt-4o
    model_type: commercial
    enabled: false

  - name: claude-sonnet
    backend: anthropic
    model_id: claude-sonnet-4-6
    model_type: commercial
    enabled: false

  - name: deepseek-flash
    backend: deepseek
    model_id: deepseek-v4-flash
    model_type: commercial
    enabled: true

  - name: deepseek-pro
    backend: deepseek
    model_id: deepseek-v4-pro
    model_type: commercial
    enabled: true

  - name: gemini-pro
    backend: gemini
    model_id: gemini-3.1-pro-preview
    model_type: commercial
    enabled: true

  - name: gemini-flash-preview
    backend: gemini
    model_id: gemini-3-flash-preview
    model_type: commercial
    enabled: true

  - name: gemini-flash
    backend: gemini
    model_id: gemini-3.5-flash
    model_type: commercial
    enabled: true

  - name: gemini-flash-lite
    backend: gemini
    model_id: gemini-3.1-flash-lite
    model_type: commercial
    enabled: true

benchmarks:
  - name: counterexample
    enabled: true
    prompt_style: v2_counterexample
    limit: null
    cfg:
      test_file: data/test_set.jsonl
      drop_unusable: true
      oracle_timeout: 12.0

  - name: gsm8k
    enabled: false
    prompt_style: standard_cot
    limit: null            # full 1319-problem test split
    cfg:
      subset: main
      split: test

  - name: math
    enabled: false
    prompt_style: standard_cot
    # MATH default loader tries HuggingFaceH4/MATH-500 (500 problems) first; if
    # you want the full 5000-problem competition_math, set cfg.dataset
    # explicitly and limit: null. Be aware: full MATH x 8 samples x 5 models
    # can run for many hours even on vLLM.
    limit: null
    cfg: {}

  - name: aime2024
    enabled: false
    prompt_style: standard_cot
    limit: null            # 30 problems
    cfg: {}

  - name: mmlu_college_math
    enabled: false         # opt-in; multiple-choice
    prompt_style: standard_cot
    limit: null
    cfg: {}
