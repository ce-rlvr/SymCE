# Eval suite template — copy + edit.
#
#   python -m training.eval.run_suite --config configs/eval/<this>.yaml
#
# This template documents every field. The actual thesis-grade config is in
# configs/eval/full_eval.yaml.

suite_name: my_eval                  # used in run-dir leaf (runs/eval/<ts>__<suite>__suite/)
seed: 42                             # base RNG seed; per-sample seed = seed + sample_idx
reward_workers: 8                    # parallel workers for benchmark scoring (not counterexample)

# ─── pass@k cutoffs ──────────────────────────────────────────────────────────
# Pass@k is computed from the SAMPLED pass (n_samples). The greedy pass always
# reports Pass@1 only. Values larger than the sampled n_samples are silently
# dropped (with a warning).
pass_at_k_values: [1, 3, 5, 8]

# ─── sampling ────────────────────────────────────────────────────────────────
# Two passes are run per cell:
#   - greedy : deterministic, single sample. Reports `pass_at_1_greedy`.
#   - sampled: temperature > 0, n_samples ≥ max(pass_at_k_values). Reports
#              `pass_at_{k}_sampled` for each requested k.
sampling:
  greedy:
    n_samples: 1
    temperature: 0.0
    max_new_tokens: 1024
    top_p: 1.0
  sampled:
    n_samples: 8
    temperature: 0.7
    max_new_tokens: 1024
    top_p: 0.95

# ─── completion cache ────────────────────────────────────────────────────────
cache:
  enabled: true
  path: runs/eval_cache/cache.sqlite

# ─── backend defaults (per backend kind) ─────────────────────────────────────
# Each model below picks a backend kind here. Anything set under a model's
# `extra:` overrides these per-instance.
backends:
  vllm:
    dtype: bfloat16
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    trust_remote_code: true
  unsloth:
    dtype: bfloat16
    max_model_len: 4096
  openai:
    env_var: OPENAI_API_KEY
    max_concurrent_requests: 8
    request_timeout_seconds: 120.0
    max_retries: 5
  deepseek:
    env_var: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com"
    max_concurrent_requests: 8
  anthropic:
    env_var: ANTHROPIC_API_KEY
    max_concurrent_requests: 4
  gemini:
    env_var: GEMINI_API_KEY
    max_concurrent_requests: 4

# ─── models ──────────────────────────────────────────────────────────────────
# Each model:
#   name:                  short id (used in result paths)
#   backend:               vllm | unsloth | openai | deepseek | anthropic | gemini
#   model_id:              HF id, local path, or API model name
#   model_type:            base | sft | rlvr | open_baseline | commercial
#   enabled:               true|false
#   external_prompt_style: auto | standard_cot | v2_counterexample
#   external_prompt_both:  if true, also run external benchmarks under the
#                          v2_counterexample prompt (used to measure
#                          catastrophic forgetting for SFT/RLVR models).
models:
  - name: qwen-base
    backend: vllm
    model_id: Qwen/Qwen2.5-Math-1.5B
    model_type: base
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: false

  - name: qwen-sft
    backend: vllm
    model_id: runs/sft/<your-sft-run>/merged          # ← edit to your actual SFT merged dir
    model_type: sft
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: true                         # ← v2 prompt control vs RLVR

  - name: qwen-rlvr
    backend: vllm
    model_id: runs/rlvr/<your-rlvr-run>/merged        # ← edit to your actual RLVR merged dir
    model_type: rlvr
    enabled: true
    external_prompt_style: standard_cot
    external_prompt_both: true                         # ← see the catastrophic-forgetting signal

  # Open baselines — see configs/eval/full_eval.yaml for the full lineup.
  - name: deepseek-math-7b
    backend: vllm
    model_id: deepseek-ai/deepseek-math-7b-rl
    model_type: open_baseline
    enabled: false

  # Commercial APIs — disabled by default (cost!). Enable individually.
  - name: gpt-4o
    backend: openai
    model_id: gpt-4o
    model_type: commercial
    enabled: false

  - name: claude-sonnet
    backend: anthropic
    model_id: claude-sonnet-4-6
    model_type: commercial
    enabled: false

  - name: deepseek-chat
    backend: deepseek
    model_id: deepseek-chat
    model_type: commercial
    enabled: false

  - name: gemini-flash
    backend: gemini
    model_id: gemini-2.0-flash
    model_type: commercial
    enabled: false

# ─── benchmarks ──────────────────────────────────────────────────────────────
# Each benchmark:
#   name:          counterexample | gsm8k | math | aime2024 | mmlu_college_math
#   enabled:       true|false
#   prompt_style:  default style; resolved at run time (see model.external_prompt_*)
#   limit:         null = all problems; int = first-N for smoke tests
#   cfg:           per-benchmark options (see comments)
benchmarks:
  - name: counterexample
    enabled: true
    prompt_style: v2_counterexample
    limit: null
    cfg:
      test_file: data/test_set_v2.jsonl
      drop_unusable: true
      oracle_timeout: 8.0

  - name: gsm8k
    enabled: true
    prompt_style: standard_cot
    limit: null
    cfg:
      subset: main
      split: test

  - name: math
    enabled: true
    prompt_style: standard_cot
    limit: 500              # null = all 5000 problems (slow!)
    cfg: {}

  - name: aime2024
    enabled: true
    prompt_style: standard_cot
    limit: null
    cfg: {}

  - name: mmlu_college_math
    enabled: false           # opt-in
    prompt_style: standard_cot
    limit: null
    cfg: {}
