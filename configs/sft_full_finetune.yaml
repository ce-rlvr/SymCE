# Full SFT training run configuration (No LoRA).
#
# Usage:
#   python -m training.sft.train --config configs/sft_full_finetune.yaml
#

sft:
  model_name: unsloth/Qwen3-4B
  chat_template: qwen-3
  max_seq_length: 1024
  dtype: bfloat16
  load_in_4bit: false

  # ── LoRA disabled for full fine-tuning ───────────────────────────────────
  use_lora: true
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  
  # For full SFT, we don't need these LoRA parameters, but we can leave them
  # as defaults or omit them. (They won't be used since use_lora is false).

  train_jsonl: data/sft_data_v2.jsonl
  eval_fraction: 0.05
  task_mode: counterexample_only

  # ── Optimisation ───────────────────────────────────────────────────────────
  # Full SFT uses much more VRAM than LoRA. 
  # We reduce per-device batch size and increase gradient accumulation steps 
  # to maintain an effective batch size of 32 (2 * 16) without OOMing on 32GB GPU.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16   
  
  num_train_epochs: 2.0
  max_steps: -1
  
  # Full SFT typically requires a smaller learning rate than LoRA
  # (e.g. 2e-5 instead of 2e-4)
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  optim: adamw_torch
  weight_decay: 0.0
  max_grad_norm: 1.0
  seed: 42

  eval_strategy: steps
  eval_steps: 80
  logging_steps: 40
  save_strategy: steps
  save_steps: 80
  save_total_limit: 3

  # Directory fallback (use_run_dir=true takes precedence normally)
  output_dir: checkpoints/sft/qwen3-4b-fullsft-bf16-v2

  # ── Run-directory + experiment tracking ────────────────────────────────────
  use_run_dir: true
  report_to: wandb
  wandb_project: ""
  wandb_group: ""

  # ── Post-train held-out probe ──────────────────────────────────────────────
  holdout_probe_enabled: true
  holdout_probe_jsonl: data/test_set_v2.jsonl
  holdout_probe_n_prompts: 50
  holdout_probe_k_samples: 5
  holdout_probe_temperature: 1.0
  holdout_probe_max_new_tokens: 512
