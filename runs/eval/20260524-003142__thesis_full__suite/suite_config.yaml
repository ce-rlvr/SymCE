suite_name: thesis_full
seed: 42
reward_workers: 8
pass_at_k_values:
- 1
- 3
- 5
- 8
backends:
  vllm:
    dtype: bfloat16
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    trust_remote_code: true
  unsloth:
    dtype: bfloat16
    max_model_len: 4096
  openai:
    env_var: OPENAI_API_KEY
    max_concurrent_requests: 8
    request_timeout_seconds: 120.0
    max_retries: 5
  deepseek:
    env_var: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_concurrent_requests: 8
  anthropic:
    env_var: ANTHROPIC_API_KEY
    max_concurrent_requests: 4
  gemini:
    env_var: GEMINI_API_KEY
    max_concurrent_requests: 4
cache:
  enabled: true
  path: runs/eval_cache/cache.sqlite
sampling:
  greedy:
    n_samples: 1
    temperature: 0.0
    max_new_tokens: 1024
    top_p: 1.0
  sampled:
    n_samples: 8
    temperature: 0.7
    max_new_tokens: 1024
    top_p: 0.95
